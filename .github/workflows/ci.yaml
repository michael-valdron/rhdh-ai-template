name: CI

# Triggers the workflow on push or pull request events but only for the experimental branch
on:
  push:
    branches: [ experimental ]
  pull_request:
    branches: [ experimental ]

jobs:
  verify-dependencies:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4.1.7

      - name: Run generate.sh and verify dependencies
        run: |
          bash generate.sh
          if [[ ! -z $(git status -s) ]]
          then
            echo 'The script `./generate.sh` did introduce changes, which should ideally be checked in as part of the PR.'
            git status
            exit 1
          fi

  yaml-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.1.7
      - name: skip checking conditional syntax
        working-directory: ./apps/ai/templates
        run: |
          find . -regextype egrep -regex '.*ya?ml$'|while read file; do
            sed -i 's/: \s*['\''"]\{0\}\([^'\''"]*{{.*}}.*\)\s*$/: '\''\1'\''/' $file
            sed -i '/^\(\s*\)\({%-.*\)$/d' $file
          done
      - name: yaml format
        run: |
          curl -L -O https://github.com/google/yamlfmt/releases/download/v0.15.0/yamlfmt_0.15.0_Linux_x86_64.tar.gz
          tar -xf yamlfmt_0.15.0_Linux_x86_64.tar.gz
          chmod +x yamlfmt
          ./yamlfmt -lint
